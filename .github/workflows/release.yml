name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6
        with:
          version: 10.33.0
          standalone: true
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package version from release tag
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pnpm release:sync-version "$RELEASE_TAG"
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./package.json', 'utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: pnpm verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6
        with:
          version: 10.33.0
          standalone: true
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package version from release tag
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pnpm release:sync-version "$RELEASE_TAG"
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./package.json', 'utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Sync checked-in package version to release branch
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_TARGET_BRANCH: ${{ github.event.release.target_commitish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="${RELEASE_TARGET_BRANCH:-$DEFAULT_BRANCH}"

          if ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Release target '$TARGET_BRANCH' is not a branch on origin; skipping package.json sync."
            exit 0
          fi

          git restore package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git switch --create "release-version-sync-$RELEASE_VERSION" "origin/$TARGET_BRANCH"
          pnpm release:sync-version "$RELEASE_VERSION"

          if git diff --quiet -- package.json; then
            echo "package.json already matches $RELEASE_VERSION on $TARGET_BRANCH."
            exit 0
          fi

          git add package.json
          git commit -m "chore: sync package version to $RELEASE_VERSION"
          git push origin HEAD:"$TARGET_BRANCH"
